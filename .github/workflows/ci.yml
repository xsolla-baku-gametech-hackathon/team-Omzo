name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://repro:repro@localhost:5432/repro?schema=public"

    services:
      # The integration suite asserts what Postgres guarantees under
      # concurrency — that a duplicate idempotency key is rejected — so it
      # needs a real one. Asserting that against a mock would only prove the
      # mock was written to agree with the code.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repro
          POSTGRES_PASSWORD: repro
          POSTGRES_DB: repro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repro -d repro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ordered cheapest-first, so a formatting slip fails in seconds rather
      # than after a build.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm exec prisma migrate deploy
      - run: pnpm test:integration

      - run: pnpm build
